---
name: Build & Test
on:
  workflow_dispatch:
  push:

jobs:
  features:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        feature:
          - asdf
          - asdf-plugin-nodejs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bin/setup
      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a Dev Container for testing
        run: >-
          devcontainer build
          --image-name ghcr.io/thoughtbot/devcontainers/images/debian
          --workspace-folder images/debian
      - name: Run feature tests
        run: >-
          devcontainer features test
          -p features
          -f ${{ matrix.feature }}
          --base-image ghcr.io/thoughtbot/devcontainers/images/debian

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: bin/setup
      - name: Build the Dev Container
        run: >-
          devcontainer build
          --image-name ghcr.io/thoughtbot/devcontainers/images/debian
          --workspace-folder images/debian
      - name: Start the container
        run: >-
          devcontainer up
          --id-label test-container=debian
          --workspace-folder "images/debian"
      - name: Run the tests in the container
        run: >-
          devcontainer exec
          --id-label test-container=debian
          --workspace-folder images/debian
          /bin/sh test/test.sh
